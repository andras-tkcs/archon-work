name: devflow-run-gh-admin-baseline
description: "Implementation of the devflow plan gh-admin-baseline (\"Strip the admin path from devflow-config; bootstrap a sealed ghadmin user with the gh-baseline tool\") from run fae5987f-65e7-48ed-a961-7676bfbb0091.\nThe plan is plans/gh-admin-baseline/plan.md on the plans branch.\nPhases run up to 3 at a time in their own worktrees, then github-admin-2:devflow-deliver reviews, opens the PR and watches it."
worktree:
  enabled: true
returns: result
outcome_field: merged
nodes:
  - id: after-steps
    bash: "printf '%s' '' | base64 -d > \"$ARTIFACTS_DIR/after.md\"\necho \"after.md written\"\n"
  - id: worktree-check
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/gh-admin-baseline'\ngit fetch origin \"$B\" 2>/dev/null || true\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nQ=\"\"\nif [ -n \"$HELD\" ]; then\n  AHEAD=$(git rev-list --count \"origin/$B..refs/heads/$B\" 2>/dev/null || echo unknown)\n  Q=\"The branch $B is already checked out in another worktree, probably left by an earlier run. Approving removes these worktrees (git worktree remove, never forced; a worktree with uncommitted changes is refused and the run fails). Do not approve if another run is still using one.\\n\\nCommits on the branch not on origin: $AHEAD\"\n  while IFS= read -r w; do Q=\"$Q\\n\\n$w\\nuncommitted paths: $(git -C \"$w\" status --porcelain | wc -l | tr -d ' ')\"; done <<< \"$HELD\"\nfi\nH=\"$HELD\" Q=\"$Q\" python3 -c 'import json,os; print(json.dumps({\"held\": os.environ[\"H\"], \"question\": os.environ[\"Q\"].replace(\"\\\\n\", \"\\n\")}))' >&3\n"
    output_format:
      type: object
      properties:
        held:
          type: string
        question:
          type: string
      required:
        - held
        - question
  - id: confirm-worktree-removal
    depends_on:
      - worktree-check
    when: "$worktree-check.output.held != ''"
    wait:
      attention: $worktree-check.output.question
      form: approval
      labels:
        workflow: devflow-run
        stage: worktree-removal
  - id: stop-at-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'reject'"
    cancel: "Stopped before implementation: the worktree holding the feature branch was not removed."
  - id: remove-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'approve'"
    bash: "set -euo pipefail\nB='feat/gh-admin-baseline'\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nwhile IFS= read -r w; do [ -n \"$w\" ] && git worktree remove \"$w\" && echo \"removed $w\" >&2; done <<< \"$HELD\"\n"
  - id: start
    depends_on:
      - worktree-check
      - confirm-worktree-removal
      - stop-at-worktrees
      - remove-worktrees
    trigger_rule: none_failed_min_one_success
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/gh-admin-baseline'; M='main'; PR='plans'\ngit fetch origin \"$M\"\ngit fetch origin \"$PR\"\nPC=$(git rev-parse FETCH_HEAD)\nHELD=$(git worktree list --porcelain | awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}')\nif [ -n \"$HELD\" ]; then echo \"devflow: branch $B is already checked out in another worktree: $HELD\" >&2; echo \"devflow: if no run is using it and it has nothing unpushed, remove it with: git worktree remove $HELD\" >&2; exit 1; fi\nif git ls-remote --exit-code --heads origin \"$B\" >/dev/null 2>&1; then\n  git fetch origin \"$B\"\n  if git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"; git merge --ff-only \"origin/$B\"; else git switch -c \"$B\" --track \"origin/$B\"; fi\nelif git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"\nelse git switch -c \"$B\" \"origin/$M\"; fi\nprintf '{\"head\":\"%s\",\"plan_commit\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" \"$PC\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
        plan_commit:
          type: string
      required:
        - head
        - plan_commit
  - id: phase-p2-merge-script
    workflow: github-admin-2:devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/gh-admin-baseline/plan.md
      plan_commit: $start.output.plan_commit
      phase: p2-merge-script
      base: $start.output.head
  - id: merge-1
    depends_on:
      - phase-p2-merge-script
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p2-merge-script.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p2-merge-script already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge gh-admin-baseline p2-merge-script: Merge gh_snapshot.py and gh_baseline.py into admin/gh-baseline.py with subcommands' -m 'Plan-Phase: gh-admin-baseline/p2-merge-script' || { git merge --abort; echo \"devflow: merging p2-merge-script conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p3-policy-file
    workflow: github-admin-2:devflow-phase
    isolation: worktree
    depends_on:
      - merge-1
    with:
      plan_ref: plans
      plan_path: plans/gh-admin-baseline/plan.md
      plan_commit: $start.output.plan_commit
      phase: p3-policy-file
      base: $merge-1.output.head
  - id: merge-2
    depends_on:
      - phase-p3-policy-file
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p3-policy-file.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p3-policy-file already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge gh-admin-baseline p3-policy-file: Move the checklist into the policy file, validate it, ship policy.example.json' -m 'Plan-Phase: gh-admin-baseline/p3-policy-file' || { git merge --abort; echo \"devflow: merging p3-policy-file conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p1-slim-devflow-config
    workflow: github-admin-2:devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/gh-admin-baseline/plan.md
      plan_commit: $start.output.plan_commit
      phase: p1-slim-devflow-config
      base: $merge-2.output.head
  - id: merge-3
    depends_on:
      - phase-p1-slim-devflow-config
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p1-slim-devflow-config.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p1-slim-devflow-config already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge gh-admin-baseline p1-slim-devflow-config: Strip the admin settings-apply path from devflow-config; add the Archon-config area' -m 'Plan-Phase: gh-admin-baseline/p1-slim-devflow-config' || { git merge --abort; echo \"devflow: merging p1-slim-devflow-config conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p4-bootstrap-admin-user
    workflow: github-admin-2:devflow-phase
    isolation: worktree
    depends_on:
      - merge-3
    with:
      plan_ref: plans
      plan_path: plans/gh-admin-baseline/plan.md
      plan_commit: $start.output.plan_commit
      phase: p4-bootstrap-admin-user
      base: $merge-3.output.head
  - id: merge-4
    depends_on:
      - phase-p4-bootstrap-admin-user
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p4-bootstrap-admin-user.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p4-bootstrap-admin-user already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge gh-admin-baseline p4-bootstrap-admin-user: Bootstrap the sealed ghadmin user, install the hash-checked admin tools, add CODEOWNERS' -m 'Plan-Phase: gh-admin-baseline/p4-bootstrap-admin-user' || { git merge --abort; echo \"devflow: merging p4-bootstrap-admin-user conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p5-docs-and-retire
    workflow: github-admin-2:devflow-phase
    isolation: worktree
    depends_on:
      - merge-4
    with:
      plan_ref: plans
      plan_path: plans/gh-admin-baseline/plan.md
      plan_commit: $start.output.plan_commit
      phase: p5-docs-and-retire
      base: $merge-4.output.head
  - id: merge-5
    depends_on:
      - phase-p5-docs-and-retire
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p5-docs-and-retire.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p5-docs-and-retire already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge gh-admin-baseline p5-docs-and-retire: Document the admin user, the agent workflow scope and the new devflow-config split in the root README' -m 'Plan-Phase: gh-admin-baseline/p5-docs-and-retire' || { git merge --abort; echo \"devflow: merging p5-docs-and-retire conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: deliver
    workflow: github-admin-2:devflow-deliver
    depends_on:
      - merge-5
      - after-steps
    with:
      plan_ref: plans
      plan_path: plans/gh-admin-baseline/plan.md
      plan_commit: $start.output.plan_commit
      slug: gh-admin-baseline
      branch: feat/gh-admin-baseline
      title: Strip the admin path from devflow-config; bootstrap a sealed ghadmin user with the gh-baseline tool
      head: $merge-5.output.head
  - id: result
    depends_on:
      - deliver
    bash: "m=$deliver.output.merged; printf '{\"merged\":%s}\\n' \"$m\"\n"
    output_format:
      type: object
      properties:
        merged:
          type: boolean
      required:
        - merged