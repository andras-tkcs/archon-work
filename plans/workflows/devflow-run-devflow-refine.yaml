name: devflow-run-devflow-refine
description: "Implementation of the devflow plan devflow-refine (\"Add devflow-refine: refine a published plan before its implementation starts\") from run 4f539cc9-9fb2-4e5a-94c3-187874466505.\nThe plan is plans/devflow-refine/plan.md on the plans branch.\nPhases run up to 3 at a time in their own worktrees, then tkcs-lab/devflow:devflow-deliver reviews, opens the PR and watches it."
worktree:
  enabled: true
returns: result
outcome_field: merged
nodes:
  - id: worktree-check
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/devflow-refine'\ngit fetch origin \"$B\" 2>/dev/null || true\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nQ=\"\"\nif [ -n \"$HELD\" ]; then\n  AHEAD=$(git rev-list --count \"origin/$B..refs/heads/$B\" 2>/dev/null || echo unknown)\n  Q=\"The branch $B is already checked out in another worktree, probably left by an earlier run. Approving removes these worktrees (git worktree remove, never forced; a worktree with uncommitted changes is refused and the run fails). Do not approve if another run is still using one.\\n\\nCommits on the branch not on origin: $AHEAD\"\n  while IFS= read -r w; do Q=\"$Q\\n\\n$w\\nuncommitted paths: $(git -C \"$w\" status --porcelain | wc -l | tr -d ' ')\"; done <<< \"$HELD\"\nfi\nH=\"$HELD\" Q=\"$Q\" python3 -c 'import json,os; print(json.dumps({\"held\": os.environ[\"H\"], \"question\": os.environ[\"Q\"].replace(\"\\\\n\", \"\\n\")}))' >&3\n"
    output_format:
      type: object
      properties:
        held:
          type: string
        question:
          type: string
      required:
        - held
        - question
  - id: confirm-worktree-removal
    depends_on:
      - worktree-check
    when: "$worktree-check.output.held != ''"
    wait:
      attention: $worktree-check.output.question
      form: approval
      labels:
        workflow: devflow-run
        stage: worktree-removal
  - id: stop-at-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'reject'"
    cancel: "Stopped before implementation: the worktree holding the feature branch was not removed."
  - id: remove-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'approve'"
    bash: "set -euo pipefail\nB='feat/devflow-refine'\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nwhile IFS= read -r w; do [ -n \"$w\" ] && git worktree remove \"$w\" && echo \"removed $w\" >&2; done <<< \"$HELD\"\n"
  - id: start
    depends_on:
      - worktree-check
      - confirm-worktree-removal
      - stop-at-worktrees
      - remove-worktrees
    trigger_rule: none_failed_min_one_success
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/devflow-refine'; M='main'; PR='plans'\ngit fetch origin \"$M\"\ngit fetch origin \"$PR\"\nPC=$(git rev-parse FETCH_HEAD)\nHELD=$(git worktree list --porcelain | awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}')\nif [ -n \"$HELD\" ]; then echo \"devflow: branch $B is already checked out in another worktree: $HELD\" >&2; echo \"devflow: if no run is using it and it has nothing unpushed, remove it with: git worktree remove $HELD\" >&2; exit 1; fi\nif git ls-remote --exit-code --heads origin \"$B\" >/dev/null 2>&1; then\n  git fetch origin \"$B\"\n  if git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"; git merge --ff-only \"origin/$B\"; else git switch -c \"$B\" --track \"origin/$B\"; fi\nelif git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"\nelse git switch -c \"$B\" \"origin/$M\"; fi\nprintf '{\"head\":\"%s\",\"plan_commit\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" \"$PC\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
        plan_commit:
          type: string
      required:
        - head
        - plan_commit
  - id: phase-p1-shared-publish-render
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/devflow-refine/plan.md
      plan_commit: $start.output.plan_commit
      phase: p1-shared-publish-render
      base: $start.output.head
  - id: merge-1
    depends_on:
      - phase-p1-shared-publish-render
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p1-shared-publish-render.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p1-shared-publish-render already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-refine p1-shared-publish-render: Move the publish-plan and render-run node logic to .shared and add commit_verb' -m 'Plan-Phase: devflow-refine/p1-shared-publish-render' || { git merge --abort; echo \"devflow: merging p1-shared-publish-render conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p2-load-published
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-1
    with:
      plan_ref: plans
      plan_path: plans/devflow-refine/plan.md
      plan_commit: $start.output.plan_commit
      phase: p2-load-published
      base: $merge-1.output.head
  - id: merge-2
    depends_on:
      - phase-p2-load-published
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p2-load-published.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p2-load-published already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-refine p2-load-published: The load-published script and its tests' -m 'Plan-Phase: devflow-refine/p2-load-published' || { git merge --abort; echo \"devflow: merging p2-load-published conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p3-refine-workflow
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/devflow-refine/plan.md
      plan_commit: $start.output.plan_commit
      phase: p3-refine-workflow
      base: $merge-2.output.head
  - id: merge-3
    depends_on:
      - phase-p3-refine-workflow
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p3-refine-workflow.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p3-refine-workflow already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-refine p3-refine-workflow: The devflow-refine workflow, its commands, thin entries, fixtures and plugin entry' -m 'Plan-Phase: devflow-refine/p3-refine-workflow' || { git merge --abort; echo \"devflow: merging p3-refine-workflow conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p4-docs-retire
    workflow: tkcs-lab/devflow:devflow-phase
    isolation: worktree
    depends_on:
      - merge-3
    with:
      plan_ref: plans
      plan_path: plans/devflow-refine/plan.md
      plan_commit: $start.output.plan_commit
      phase: p4-docs-retire
      base: $merge-3.output.head
  - id: merge-4
    depends_on:
      - phase-p4-docs-retire
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p4-docs-retire.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p4-docs-retire already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-refine p4-docs-retire: Document devflow-refine' -m 'Plan-Phase: devflow-refine/p4-docs-retire' || { git merge --abort; echo \"devflow: merging p4-docs-retire conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: deliver
    workflow: tkcs-lab/devflow:devflow-deliver
    depends_on:
      - merge-4
    with:
      plan_ref: plans
      plan_path: plans/devflow-refine/plan.md
      plan_commit: $start.output.plan_commit
      slug: devflow-refine
      branch: feat/devflow-refine
      title: "Add devflow-refine: refine a published plan before its implementation starts"
      head: $merge-4.output.head
  - id: result
    depends_on:
      - deliver
    bash: "m=$deliver.output.merged; printf '{\"merged\":%s}\\n' \"$m\"\n"
    output_format:
      type: object
      properties:
        merged:
          type: boolean
      required:
        - merged