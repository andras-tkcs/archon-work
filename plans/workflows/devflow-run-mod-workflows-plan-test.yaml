name: devflow-run-mod-workflows-plan-test
description: "Implementation of the devflow plan mod-workflows-plan-test (\"Rename the devflow pack's internal workflows to mod-devflow-* and test every plan before devflow-plan publishes it\") from run 9a7598c7-2ecf-440a-ac3a-35e6b09ab4f6.\nThe plan is plans/mod-workflows-plan-test/plan.md on the plans branch.\nPhases run up to 3 at a time in their own worktrees, then workflow-improvements:devflow-deliver reviews, opens the PR and watches it."
worktree:
  enabled: true
returns: result
outcome_field: merged
nodes:
  - id: after-steps
    bash: "printf '%s' '' | base64 -d > \"$ARTIFACTS_DIR/after.md\"\necho \"after.md written\"\n"
  - id: worktree-check
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/mod-workflows-plan-test'\ngit fetch origin \"$B\" 2>/dev/null || true\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nQ=\"\"\nif [ -n \"$HELD\" ]; then\n  AHEAD=$(git rev-list --count \"origin/$B..refs/heads/$B\" 2>/dev/null || echo unknown)\n  Q=\"The branch $B is already checked out in another worktree, probably left by an earlier run. Approving removes these worktrees (git worktree remove, never forced; a worktree with uncommitted changes is refused and the run fails). Do not approve if another run is still using one.\\n\\nCommits on the branch not on origin: $AHEAD\"\n  while IFS= read -r w; do Q=\"$Q\\n\\n$w\\nuncommitted paths: $(git -C \"$w\" status --porcelain | wc -l | tr -d ' ')\"; done <<< \"$HELD\"\nfi\nH=\"$HELD\" Q=\"$Q\" python3 -c 'import json,os; print(json.dumps({\"held\": os.environ[\"H\"], \"question\": os.environ[\"Q\"].replace(\"\\\\n\", \"\\n\")}))' >&3\n"
    output_format:
      type: object
      properties:
        held:
          type: string
        question:
          type: string
      required:
        - held
        - question
  - id: confirm-worktree-removal
    depends_on:
      - worktree-check
    when: "$worktree-check.output.held != ''"
    wait:
      attention: $worktree-check.output.question
      form: approval
      labels:
        workflow: devflow-run
        stage: worktree-removal
  - id: stop-at-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'reject'"
    cancel: "Stopped before implementation: the worktree holding the feature branch was not removed."
  - id: remove-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'approve'"
    bash: "set -euo pipefail\nB='feat/mod-workflows-plan-test'\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nwhile IFS= read -r w; do [ -n \"$w\" ] && git worktree remove \"$w\" && echo \"removed $w\" >&2; done <<< \"$HELD\"\n"
  - id: start
    depends_on:
      - worktree-check
      - confirm-worktree-removal
      - stop-at-worktrees
      - remove-worktrees
    trigger_rule: none_failed_min_one_success
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/mod-workflows-plan-test'; M='main'; PR='plans'\ngit fetch origin \"$M\"\ngit fetch origin \"$PR\"\nPC=$(git rev-parse FETCH_HEAD)\nHELD=$(git worktree list --porcelain | awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}')\nif [ -n \"$HELD\" ]; then echo \"devflow: branch $B is already checked out in another worktree: $HELD\" >&2; echo \"devflow: if no run is using it and it has nothing unpushed, remove it with: git worktree remove $HELD\" >&2; exit 1; fi\nif git ls-remote --exit-code --heads origin \"$B\" >/dev/null 2>&1; then\n  git fetch origin \"$B\"\n  if git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"; git merge --ff-only \"origin/$B\"; else git switch -c \"$B\" --track \"origin/$B\"; fi\nelif git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"\nelse git switch -c \"$B\" \"origin/$M\"; fi\nprintf '{\"head\":\"%s\",\"plan_commit\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" \"$PC\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
        plan_commit:
          type: string
      required:
        - head
        - plan_commit
  - id: phase-p1-rename-internal-workflows
    workflow: workflow-improvements:devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/mod-workflows-plan-test/plan.md
      plan_commit: $start.output.plan_commit
      phase: p1-rename-internal-workflows
      base: $start.output.head
  - id: merge-1
    depends_on:
      - phase-p1-rename-internal-workflows
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p1-rename-internal-workflows.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p1-rename-internal-workflows already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge mod-workflows-plan-test p1-rename-internal-workflows: Rename the four internal workflows to mod-devflow-* and repair test-render-run.sh' -m 'Plan-Phase: mod-workflows-plan-test/p1-rename-internal-workflows' || { git merge --abort; echo \"devflow: merging p1-rename-internal-workflows conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p2-plan-test-scripts
    workflow: workflow-improvements:devflow-phase
    isolation: worktree
    depends_on:
      - merge-1
    with:
      plan_ref: plans
      plan_path: plans/mod-workflows-plan-test/plan.md
      plan_commit: $start.output.plan_commit
      phase: p2-plan-test-scripts
      base: $merge-1.output.head
  - id: merge-2
    depends_on:
      - phase-p2-plan-test-scripts
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p2-plan-test-scripts.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p2-plan-test-scripts already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge mod-workflows-plan-test p2-plan-test-scripts: render-run reports plan errors as output and checks the catalog; new test-plan and check-plan scripts with tests' -m 'Plan-Phase: mod-workflows-plan-test/p2-plan-test-scripts' || { git merge --abort; echo \"devflow: merging p2-plan-test-scripts conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p3-plan-test-loop
    workflow: workflow-improvements:devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/mod-workflows-plan-test/plan.md
      plan_commit: $start.output.plan_commit
      phase: p3-plan-test-loop
      base: $merge-2.output.head
  - id: merge-3
    depends_on:
      - phase-p3-plan-test-loop
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p3-plan-test-loop.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p3-plan-test-loop already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge mod-workflows-plan-test p3-plan-test-loop: Wire the plan test into devflow-plan as a fix loop, add the reviewer, assumptions in finalize and publish' -m 'Plan-Phase: mod-workflows-plan-test/p3-plan-test-loop' || { git merge --abort; echo \"devflow: merging p3-plan-test-loop conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p4-retire-docs
    workflow: workflow-improvements:devflow-phase
    isolation: worktree
    depends_on:
      - merge-3
    with:
      plan_ref: plans
      plan_path: plans/mod-workflows-plan-test/plan.md
      plan_commit: $start.output.plan_commit
      phase: p4-retire-docs
      base: $merge-3.output.head
  - id: merge-4
    depends_on:
      - phase-p4-retire-docs
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p4-retire-docs.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p4-retire-docs already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge mod-workflows-plan-test p4-retire-docs: Retirement - README updates for the plan test and the renamed building blocks' -m 'Plan-Phase: mod-workflows-plan-test/p4-retire-docs' || { git merge --abort; echo \"devflow: merging p4-retire-docs conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: deliver
    workflow: workflow-improvements:devflow-deliver
    depends_on:
      - merge-4
      - after-steps
    with:
      plan_ref: plans
      plan_path: plans/mod-workflows-plan-test/plan.md
      plan_commit: $start.output.plan_commit
      slug: mod-workflows-plan-test
      branch: feat/mod-workflows-plan-test
      title: "Rename the devflow pack's internal workflows to mod-devflow-* and test every plan before devflow-plan publishes it"
      head: $merge-4.output.head
  - id: result
    depends_on:
      - deliver
    bash: "m=$deliver.output.merged; printf '{\"merged\":%s}\\n' \"$m\"\n"
    output_format:
      type: object
      properties:
        merged:
          type: boolean
      required:
        - merged