name: devflow-run-devflow-plan-issue-comments
description: "Implementation of the devflow plan devflow-plan-issue-comments (\"devflow-plan: follow the plan run and its implementation run on the issue\") from run ab1555dc-3789-4b37-ad28-a31ded8d92f9.\nThe plan is plans/devflow-plan-issue-comments/plan.md on the plans branch.\nPhases run up to 3 at a time in their own worktrees, then tkcs-lab/devflow:mod-devflow-deliver reviews, opens the PR and watches it."
worktree:
  enabled: true
returns: result
outcome_field: merged
nodes:
  - id: after-steps
    bash: "printf '%s' '' | base64 -d > \"$ARTIFACTS_DIR/after.md\"\necho \"after.md written\"\n"
  - id: worktree-check
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/devflow-plan-issue-comments'\ngit fetch origin \"$B\" 2>/dev/null || true\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nQ=\"\"\nif [ -n \"$HELD\" ]; then\n  AHEAD=$(git rev-list --count \"origin/$B..refs/heads/$B\" 2>/dev/null || echo unknown)\n  Q=\"The branch $B is already checked out in another worktree, probably left by an earlier run. Approving removes these worktrees (git worktree remove, never forced; a worktree with uncommitted changes is refused and the run fails). Do not approve if another run is still using one.\\n\\nCommits on the branch not on origin: $AHEAD\"\n  while IFS= read -r w; do Q=\"$Q\\n\\n$w\\nuncommitted paths: $(git -C \"$w\" status --porcelain | wc -l | tr -d ' ')\"; done <<< \"$HELD\"\nfi\nH=\"$HELD\" Q=\"$Q\" python3 -c 'import json,os; print(json.dumps({\"held\": os.environ[\"H\"], \"question\": os.environ[\"Q\"].replace(\"\\\\n\", \"\\n\")}))' >&3\n"
    output_format:
      type: object
      properties:
        held:
          type: string
        question:
          type: string
      required:
        - held
        - question
  - id: confirm-worktree-removal
    depends_on:
      - worktree-check
    when: "$worktree-check.output.held != ''"
    wait:
      attention: $worktree-check.output.question
      form: approval
      labels:
        workflow: devflow-run
        stage: worktree-removal
  - id: stop-at-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'reject'"
    cancel: "Stopped before implementation: the worktree holding the feature branch was not removed."
  - id: remove-worktrees
    depends_on:
      - confirm-worktree-removal
    when: "$confirm-worktree-removal.output.decision == 'approve'"
    bash: "set -euo pipefail\nB='feat/devflow-plan-issue-comments'\nHELD=$(awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}' <(git worktree list --porcelain))\nwhile IFS= read -r w; do [ -n \"$w\" ] && git worktree remove \"$w\" && echo \"removed $w\" >&2; done <<< \"$HELD\"\n"
  - id: start
    depends_on:
      - worktree-check
      - confirm-worktree-removal
      - stop-at-worktrees
      - remove-worktrees
    trigger_rule: none_failed_min_one_success
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nB='feat/devflow-plan-issue-comments'; M='main'; PR='plans'\ngit fetch origin \"$M\"\ngit fetch origin \"$PR\"\nPC=$(git rev-parse FETCH_HEAD)\nHELD=$(git worktree list --porcelain | awk -v b=\"refs/heads/$B\" -v me=\"$(git rev-parse --show-toplevel)\" '$1==\"worktree\"{w=$2} $1==\"branch\" && $2==b && w!=me{print w}')\nif [ -n \"$HELD\" ]; then echo \"devflow: branch $B is already checked out in another worktree: $HELD\" >&2; echo \"devflow: if no run is using it and it has nothing unpushed, remove it with: git worktree remove $HELD\" >&2; exit 1; fi\nif git ls-remote --exit-code --heads origin \"$B\" >/dev/null 2>&1; then\n  git fetch origin \"$B\"\n  if git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"; git merge --ff-only \"origin/$B\"; else git switch -c \"$B\" --track \"origin/$B\"; fi\nelif git rev-parse --verify --quiet \"refs/heads/$B\" >/dev/null; then git switch \"$B\"\nelse git switch -c \"$B\" \"origin/$M\"; fi\nprintf '{\"head\":\"%s\",\"plan_commit\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" \"$PC\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
        plan_commit:
          type: string
      required:
        - head
        - plan_commit
  - id: phase-p1-issue-helper
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p1-issue-helper
      base: $start.output.head
  - id: phase-p3-archon-public-url
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - start
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p3-archon-public-url
      base: $start.output.head
  - id: merge-1
    depends_on:
      - phase-p1-issue-helper
      - phase-p3-archon-public-url
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p1-issue-helper.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p1-issue-helper already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-plan-issue-comments p1-issue-helper: The pure issue helper (.shared/issue.ts) and its unit tests' -m 'Plan-Phase: devflow-plan-issue-comments/p1-issue-helper' || { git merge --abort; echo \"devflow: merging p1-issue-helper conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nh2=$phase-p3-archon-public-url.output.head\nif git merge-base --is-ancestor \"$h2\" HEAD; then echo \"p3-archon-public-url already merged\" >&2\nelse git merge --no-ff \"$h2\" -m 'Merge devflow-plan-issue-comments p3-archon-public-url: bootstrap.sh writes ARCHON_PUBLIC_URL from Tailscale; root README documents it' -m 'Plan-Phase: devflow-plan-issue-comments/p3-archon-public-url' || { git merge --abort; echo \"devflow: merging p3-archon-public-url conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p2-issue-node
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - merge-1
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p2-issue-node
      base: $merge-1.output.head
  - id: merge-2
    depends_on:
      - phase-p2-issue-node
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p2-issue-node.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p2-issue-node already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-plan-issue-comments p2-issue-node: The node CLI (.shared/issue-node.ts), published.json and their end-to-end tests' -m 'Plan-Phase: devflow-plan-issue-comments/p2-issue-node' || { git merge --abort; echo \"devflow: merging p2-issue-node conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p4-plan-run-comments
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p4-plan-run-comments
      base: $merge-2.output.head
  - id: phase-p5-run-workflow-comments
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - merge-2
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p5-run-workflow-comments
      base: $merge-2.output.head
  - id: merge-3
    depends_on:
      - phase-p4-plan-run-comments
      - phase-p5-run-workflow-comments
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p4-plan-run-comments.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p4-plan-run-comments already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-plan-issue-comments p4-plan-run-comments: devflow-plan detects the issue and posts started, stopped, ready and failed comments' -m 'Plan-Phase: devflow-plan-issue-comments/p4-plan-run-comments' || { git merge --abort; echo \"devflow: merging p4-plan-run-comments conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nh2=$phase-p5-run-workflow-comments.output.head\nif git merge-base --is-ancestor \"$h2\" HEAD; then echo \"p5-run-workflow-comments already merged\" >&2\nelse git merge --no-ff \"$h2\" -m 'Merge devflow-plan-issue-comments p5-run-workflow-comments: render-run emits the issue header and mod-devflow-issue nodes; the new building block' -m 'Plan-Phase: devflow-plan-issue-comments/p5-run-workflow-comments' || { git merge --abort; echo \"devflow: merging p5-run-workflow-comments conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p6-pr-closes-issue
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - merge-3
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p6-pr-closes-issue
      base: $merge-3.output.head
  - id: merge-4
    depends_on:
      - phase-p6-pr-closes-issue
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p6-pr-closes-issue.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p6-pr-closes-issue already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-plan-issue-comments p6-pr-closes-issue: The rendered deliver node passes the issue and the PR always says Closes' -m 'Plan-Phase: devflow-plan-issue-comments/p6-pr-closes-issue' || { git merge --abort; echo \"devflow: merging p6-pr-closes-issue conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p7-refine-keeps-issue
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - merge-4
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p7-refine-keeps-issue
      base: $merge-4.output.head
  - id: merge-5
    depends_on:
      - phase-p7-refine-keeps-issue
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p7-refine-keeps-issue.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p7-refine-keeps-issue already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-plan-issue-comments p7-refine-keeps-issue: devflow-refine reads the issue header back and re-renders with it' -m 'Plan-Phase: devflow-plan-issue-comments/p7-refine-keeps-issue' || { git merge --abort; echo \"devflow: merging p7-refine-keeps-issue conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: phase-p8-docs
    workflow: tkcs-lab/devflow:mod-devflow-phase
    isolation: worktree
    depends_on:
      - merge-5
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      phase: p8-docs
      base: $merge-5.output.head
  - id: merge-6
    depends_on:
      - phase-p8-docs
    bash: "set -euo pipefail\nexec 3>&1 1>&2\nh1=$phase-p8-docs.output.head\nif git merge-base --is-ancestor \"$h1\" HEAD; then echo \"p8-docs already merged\" >&2\nelse git merge --no-ff \"$h1\" -m 'Merge devflow-plan-issue-comments p8-docs: Retirement - document issue comments in the devflow pack README' -m 'Plan-Phase: devflow-plan-issue-comments/p8-docs' || { git merge --abort; echo \"devflow: merging p8-docs conflicts; its touches overlap another phase\" >&2; exit 1; }\nfi\nprintf '{\"head\":\"%s\"}\\n' \"$(git rev-parse HEAD)\" >&3\n"
    output_format:
      type: object
      properties:
        head:
          type: string
      required:
        - head
  - id: deliver
    workflow: tkcs-lab/devflow:mod-devflow-deliver
    depends_on:
      - merge-6
      - after-steps
    with:
      plan_ref: plans
      plan_path: plans/devflow-plan-issue-comments/plan.md
      plan_commit: $start.output.plan_commit
      slug: devflow-plan-issue-comments
      branch: feat/devflow-plan-issue-comments
      title: "devflow-plan: follow the plan run and its implementation run on the issue"
      head: $merge-6.output.head
  - id: result
    depends_on:
      - deliver
    bash: "m=$deliver.output.merged; printf '{\"merged\":%s}\\n' \"$m\"\n"
    output_format:
      type: object
      properties:
        merged:
          type: boolean
      required:
        - merged