name: mod-devflow-phase
description: |
  Internal building block (mod-), started by a build-issue-<n> workflow; never start it yourself.

  Implements one phase of a published plan in its own worktree, unattended: it runs only when
  every phase it depends on is done (else it records itself as skipped), reads the plan and the
  test plan, resets the worktree to the base the parent hands over, implements the phase with
  fast checks after each step, and records a typed outcome (done or stuck, with the decisions it
  took and the test cases it ran) for the build's merge and wrap. A phase that cannot finish is
  stuck, never a failed run. The parent merges a done phase's commit with the Plan-Phase
  trailer. devflow-follow-up includes it with a task file instead of a manifest phase.
model: medium
worktree:
  enabled: true
inputs:
  plan_ref:
    default: ""
    description: The branch that holds the published plan.
  plan_path:
    default: ""
    description: The plan's path on that branch.
  plan_commit:
    default: ""
    description: The commit of the plan to read, so no fetch is needed.
  phase:
    default: ""
    description: The id of the phase to implement.
  base:
    default: ""
    description: The commit the worktree starts from, the parent's head before this wave.
  depends_on:
    default: ""
    description: The manifest phases this one depends on, comma-separated; each must be done, else this phase is skipped.
  run_key:
    default: ""
    description: The build's run key from mod-devflow-start; names the shared outcomes.
  task:
    default: ""
    description: A task file that replaces the manifest phase's brief (devflow-follow-up's f<k> phases).
returns: record-outcome

nodes:
  - id: deps-check
    script: deps-check
    runtime: bun
    with:
      phase: "$INPUTS.phase"
      depends_on: "$INPUTS.depends_on"
      run_key: "$INPUTS.run_key"
      base: "$INPUTS.base"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
      required: [ready]

  - id: preflight
    depends_on: [deps-check]
    when: "$deps-check.output.ready == true"
    script: preflight
    runtime: bun
    output_format:
      type: object
      properties:
        shared_dir: { type: string }
        main_branch: { type: string }
        branch_regex: { type: string }
      required: [shared_dir, main_branch, branch_regex]

  - id: setup
    depends_on: [preflight]
    script: setup-env
    runtime: bun
    timeout: 1800000

  - id: load-plan
    depends_on: [setup]
    script: load-plan
    runtime: bun
    with:
      mode: phase
      shared_dir: "$preflight.output.shared_dir"
      task: "$INPUTS.task"
      run_key: "$INPUTS.run_key"
    output_format:
      type: object
      properties:
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
        done: { type: boolean }
        model: { type: string }
      required: [slug, branch, title, done, model]

  - id: build
    depends_on: [load-plan]
    when: "$load-plan.output.done == false"
    loop_group:
      nodes:
        - id: implement-small
          when: "$load-plan.output.model == 'small'"
          command: implement-phase
          model: small
          context: fresh
          output_format: &implement_out
            type: object
            properties:
              status: { type: string, enum: [continue, complete, blocked] }
              phase: { type: string }
              summary: { type: string }
            required: [status, phase, summary]
        - id: implement-medium
          when: "$load-plan.output.model == 'medium'"
          command: implement-phase
          model: medium
          context: fresh
          output_format: *implement_out
        - id: implement-large
          when: "$load-plan.output.model == 'large'"
          command: implement-phase
          model: large
          context: fresh
          output_format: *implement_out
        - id: implement
          depends_on: [implement-small, implement-medium, implement-large]
          trigger_rule: one_success
          script: pick-one
          runtime: bun
          with:
            small: { from: "$implement-small.output", if_skipped: "" }
            medium: { from: "$implement-medium.output", if_skipped: "" }
            large: { from: "$implement-large.output", if_skipped: "" }
          output_format: *implement_out
        - id: check
          depends_on: [implement]
          script: verify
          runtime: bun
          timeout: 1800000
          with:
            mode: fast
          output_format:
            type: object
            properties:
              green: { type: boolean }
              failed: { type: array, items: { type: string } }
              unavailable: { type: array, items: { type: string } }
              report: { type: string }
            required: [green, failed, unavailable, report]
      until_bash: 's=$implement.output.status; g=$check.output.green; [ "$s" = blocked ] || { [ "$s" = complete ] && [ "$g" = true ]; }'
      max_iterations: 6

  # Runs after a failed or exhausted build loop too, so a red phase is reported as stuck.
  - id: gate
    depends_on: [load-plan, build]
    trigger_rule: all_done
    when: "$deps-check.output.ready == true"
    script: gate-phase
    runtime: bun
    with:
      base: "$INPUTS.base"
      phase: "$INPUTS.phase"
      done: "$load-plan.output.done"
    output_format:
      type: object
      properties:
        head: { type: string }
        phase: { type: string }
        skipped: { type: boolean }
        status: { type: string, enum: [done, stuck] }
        stuck_reason: { type: string }
        partial_head: { type: string }
      required: [head, phase, skipped, status, stuck_reason, partial_head]

  - id: record-outcome
    depends_on: [deps-check, gate]
    trigger_rule: all_done
    script: record-outcome
    runtime: bun
    with:
      phase: "$INPUTS.phase"
      base: "$INPUTS.base"
      run_key: "$INPUTS.run_key"
    output_format:
      type: object
      properties:
        phase: { type: string }
        status: { type: string, enum: [done, stuck, failed, skipped] }
        head: { type: string }
        summary: { type: string }
        stuck_reason: { type: string }
        decisions: { type: array }
        cases: { type: array }
        partial_head: { type: string }
        skipped: { type: boolean }
      required: [phase, status, head, summary, stuck_reason, decisions, cases, partial_head, skipped]
