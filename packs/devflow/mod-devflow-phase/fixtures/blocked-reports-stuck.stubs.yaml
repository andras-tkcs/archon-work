# The implementer is blocked and the checks are red: the real gate-phase reports the phase as
# stuck and the real record-outcome records it; the block completes, so the build carries on.
exec-code: true
fixture:
  expect: completed
  reached: [gate, record-outcome]
  inputs:
    phase: p1-x
    base: HEAD
deps-check: { ready: true }
preflight:
  shared_dir: /stub/devflow
  main_branch: main
  branch_regex: "^(feature|fix|chore|tests)/[a-z0-9]+(-[a-z0-9]+)*$"
setup: '{"hooks":[],"env_file":"project-env.sh"}'
load-plan:
  slug: x
  branch: feat/x
  title: X
  done: false
  model: medium
implement-medium:
  status: blocked
  phase: p1-x
  summary: stub
check:
  green: false
  failed: []
  unavailable: []
  report: /stub/verify-fast.md
