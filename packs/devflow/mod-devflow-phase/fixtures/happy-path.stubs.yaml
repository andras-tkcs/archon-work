# Green path: the phase is not merged yet, one implement step, green checks.
fixture:
  expect: completed
deps-check: { ready: true }
preflight:
  shared_dir: /stub/devflow
  main_branch: main
  branch_regex: "^(feature|fix|chore|tests)/[a-z0-9]+(-[a-z0-9]+)*$"
setup: '{"hooks":[],"env_file":"project-env.sh"}'
load-plan:
  slug: x
  branch: feat/x
  title: X
  done: false
  model: medium
implement-medium:
  status: complete
  phase: p1-x
  summary: stub
implement:
  status: complete
  phase: p1-x
  summary: stub
check:
  green: true
  failed: []
  unavailable: []
  report: /stub/verify-fast.md
gate: { head: abc, phase: p1-x, skipped: false, status: done, stuck_reason: "", partial_head: "" }
record-outcome: { phase: p1-x, status: done, head: abc, summary: stub, stuck_reason: "", decisions: [], cases: [], partial_head: "", skipped: false }
