name: mod-devflow-tail
description: |
  Building block, not a workflow to run alone. The delivery tail every devflow workflow shares:
  a review (large tier unless the includer passes `review_model: medium`) with fix rounds until no blocking finding is left, the non-blocking findings fixed
  or declined, the definition of done (verify.dod) and local CI (mod-devflow-dod), one PR (a draft
  when local CI stays red), then a watch that hands
  conflicts, red checks and review threads to a steward until a person merges or closes it.
  Never merges.

  Reads its facts from $ARTIFACTS_DIR (context.json, profile.json, and plan.md or work.md), which
  the including workflow writes before it starts; the branch is committed and the tree clean.
model: large
returns: finish
inputs:
  review_model:
    default: large
    description: The tier of the final review, medium or large. mod-devflow-deliver passes the plan's review_model; the other includers keep the default.
  issue:
    default: ""
    description: The issue whose devflow comment records the PR and its end; empty for work without an issue (the trace nodes then do nothing).
  run_key:
    default: ""
    description: A build's run key from mod-devflow-start, so local CI and the PR reach the build's shared outcomes; empty outside a build.

nodes:
  - id: review-tier
    bash: |
      m=$INPUTS.review_model
      case "$m" in
        medium|large) printf '{"model":"%s"}\n' "$m" ;;
        *) echo "devflow: review_model must be medium or large, not '$m'" >&2; exit 1 ;;
      esac
    output_format:
      type: object
      properties:
        model: { type: string }
      required: [model]

  # ---- 3 + 4. review (fresh) and fix the blocking findings, until none are left ------
  # Each round fixes what the previous review found, then reviews again, so the loop's output
  # is always the latest review's verdict; review-gate reads it after the loop.
  - id: review-loop
    depends_on: [review-tier]
    loop_group:
      nodes:
        - id: fix-blocking
          when: "$LOOP_PREV.review.output.blocking > 0"
          command: fix-blocking
          model: medium
          context: fresh
        - id: review-medium
          depends_on: [fix-blocking]
          trigger_rule: all_done
          when: "$review-tier.output.model == 'medium'"
          command: review
          model: medium
          context: fresh
          output_format: &review_out
            type: object
            properties:
              verdict: { type: string, enum: [approve, changes] }
              blocking: { type: integer }
              non_blocking: { type: integer }
              head: { type: string }
            required: [verdict, blocking, non_blocking, head]
        - id: review-large
          depends_on: [fix-blocking]
          trigger_rule: all_done
          when: "$review-tier.output.model == 'large'"
          command: review
          model: large
          context: fresh
          output_format: *review_out
        - id: review
          depends_on: [review-medium, review-large]
          trigger_rule: one_success
          script: pick-one
          runtime: bun
          with:
            medium: { from: "$review-medium.output", if_skipped: "" }
            large: { from: "$review-large.output", if_skipped: "" }
          output_format: *review_out
      until_bash: 'b=$review.output.blocking; [ "$b" -eq 0 ]'
      max_iterations: 3

  - id: review-gate
    depends_on: [review-loop]
    when: "$review-loop.output.blocking > 0"
    bash: 'echo "devflow: the review still has blocking findings after its last round; a person decides next (see review.md in the run artifacts)" >&2; exit 1'

  # ---- 5. fix the non-blocking findings (or decline each with a reason) -------------------
  - id: fix-nonblocking
    depends_on: [review-loop, review-gate]
    trigger_rule: none_failed_min_one_success
    command: fix-nonblocking
    model: medium
    context: fresh

  # ---- Definition of done: verify.dod, then local CI (mod-devflow-dod) ---------------------
  - id: dod-ci
    include: mod-devflow-dod
    depends_on: [fix-nonblocking]
    with:
      run_key: "$INPUTS.run_key"

  - id: dod-gate
    depends_on: [dod-ci]
    when: "$dod-ci.output.ok == false"
    bash: 'echo "devflow: the definition of done is still red after its last fix; no PR was opened (see verify-dod.md in the run artifacts)" >&2; exit 1'

  # ---- Open the one PR ---------------------------------------------------------------------
  - id: open-pr
    depends_on: [dod-ci, dod-gate]
    trigger_rule: none_failed_min_one_success
    command: open-pr
    model: medium
    context: fresh
    output_format:
      type: object
      properties:
        number: { type: integer }
        url: { type: string }
      required: [number, url]

  - id: trace-pr
    include: mod-devflow-trace
    depends_on: [open-pr]
    with:
      issue: "$INPUTS.issue"
      event: pr_open
      pr_number: "$open-pr.output.number"
      pr_url: "$open-pr.output.url"

  # ---- 6. watch the PR until it merges: conflicts, red CI, review threads ------------------
  - id: watch
    depends_on: [open-pr]
    loop_group:
      nodes:
        - id: pr-state
          script: pr-state
          runtime: bun
          with:
            number: "$open-pr.output.number"
          output_format:
            type: object
            properties:
              finished: { type: boolean }
              state: { type: string }
              act: { type: boolean }
              reasons: { type: string }
            required: [finished, state, act, reasons]
        - id: steward
          depends_on: [pr-state]
          when: "$pr-state.output.act == true"
          command: steward
          model: medium
          context: fresh
        - id: pause
          depends_on: [pr-state, steward]
          trigger_rule: all_done
          when: "$pr-state.output.finished == false"
          wait:
            duration_ms: 600000
      until_bash: 'f=$pr-state.output.finished; [ "$f" = true ]'
      max_iterations: 600

  - id: finish
    depends_on: [watch]
    script: finish
    runtime: bun
    with:
      number: "$open-pr.output.number"
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        state: { type: string }
        url: { type: string }
      required: [merged, state, url]

  - id: trace-finish
    include: mod-devflow-trace
    depends_on: [open-pr, finish]
    with:
      issue: "$INPUTS.issue"
      event: finished
      pr_number: "$open-pr.output.number"
      pr_url: "$finish.output.url"
      state: "$finish.output.state"
