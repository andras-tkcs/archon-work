name: devflow-plan
description: |
  The first half of the devflow toolkit's ship workflow: plans only. It interviews you one
  question at a time (the planner asks the most decisive open question, and before it stops a
  fresh reviewer tries to find one more), writes the plan, publishes the plan and the steps you
  must do by hand as run artifacts, and publishes a devflow-run-<slug> workflow that
  implements the plan's phases up to three at a time and then reviews, opens the PR and
  watches it. Nothing is implemented by this run.

  Use when: a change should be planned with you in the loop, so you can start its implementation
  when you are ready, "plan this issue with devflow".
  NOT for: confidential security work (devflow-audit keeps its plans off the plans branch), a
  quick edit (devflow-quick), or implementing a plan that already exists.
model: large
worktree:
  enabled: true
inputs:
  work:
    default: ""
    description: What to plan (an issue number or URL, a /review document URL, or a description). Empty means the run's message is the work.
  plans_ref:
    default: plans
    description: The branch the plan and the generated workflow are pushed to.
  plans_dir:
    default: plans
    description: The directory on that branch that holds plans/<slug>/ and workflows/.
  pack:
    default: ""
    description: The installed pack's qualified name the generated workflow starts its phases from, for example tkcs-lab/devflow. Empty means auto-detect.
returns: interview

nodes:
  # ---- Setup: profile, toolkit, environment ----------------------------------------------
  - id: preflight
    script: preflight
    runtime: bun
    output_format:
      type: object
      properties:
        devflow_root: { type: string }
        main_branch: { type: string }
        branch_regex: { type: string }
      required: [devflow_root, main_branch, branch_regex]

  - id: setup
    depends_on: [preflight]
    script: setup-env
    runtime: bun
    timeout: 1800000

  # ---- 1. The interview: one question at a time -------------------------------------------
  - id: interview
    depends_on: [setup]
    loop_group:
      max_iterations: 15
      nodes:
        - id: draft
          command: draft
          model: large
          context: fresh
          output_format:
            type: object
            properties:
              status: { type: string, enum: [ask, done, stop] }
              question: { type: string }
              why_no_more: { type: string }
            required: [status, question, why_no_more]

        - id: challenge
          depends_on: [draft]
          when: "$draft.output.status == 'done'"
          command: challenge
          model: large
          context: fresh
          output_format:
            type: object
            properties:
              question: { type: string }
              reason: { type: string }
            required: [question, reason]

        - id: next
          depends_on: [draft, challenge]
          trigger_rule: all_done
          script: next-question
          runtime: bun
          with:
            draft: "$draft.output"
            challenge: { from: "$challenge.output", if_skipped: "" }
          output_format:
            type: object
            properties:
              done: { type: boolean }
              stop: { type: boolean }
              question: { type: string }
            required: [done, stop, question]

        - id: ask
          depends_on: [next]
          when: "$next.output.done == false"
          wait:
            attention: "$next.output.question"
            form: message
            labels:
              workflow: devflow-plan
              stage: interview
      until_bash: 'd=$next.output.done; [ "$d" = true ]'

  - id: stop-at-interview
    depends_on: [interview]
    when: "$interview.output.stop == true"
    cancel: "Stopped while planning: the interview ended without a plan (stopped by the answer, or 14 questions without converging). The questions and answers are interview.md in the run artifacts."
  # p5: finalize, render, publish follow
