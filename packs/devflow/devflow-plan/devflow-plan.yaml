name: devflow-plan
description: |
  Plans an issue whose design devflow-refine published: writes plan.md (the implementation),
  plan-test.md (the test plan), before.md and after.md (the steps only a person can do), tests the
  plan (validate-docs, the manifest validator, a dry run of the generated workflow and a fresh
  reviewer; up to two fix rounds) and publishes the four files with the build workflow
  build-issue-<n> to the plans branch in one commit, then updates the issue's devflow comment.
  It never pauses and implements nothing.

  Accepts an issue number or URL, a plan or design URL, or a file name such as issue-42/plan.md.
  Refuses an issue without a design (run devflow-refine first), a closed issue, one whose build
  has started, or a design.md that does not validate (every error listed). When the design leaves
  a gap the planner cannot decide, it ends planned: false, needs_refine: true and puts the
  question on the issue comment; nothing is committed.

  Use when: a refined issue should get its plan and build workflow, "plan issue 42 with devflow".
  NOT for: an issue without a design (devflow-refine), confidential security work (devflow-audit
  keeps its plans off the plans branch), or a quick edit (devflow-quick).
model: medium
worktree:
  enabled: true
inputs:
  work:
    default: ""
    description: The issue to plan (a number, #number or URL, a plan or design URL, or issue-<n>/plan.md). Empty means the run's message.
  plans_ref:
    default: ""
    description: The plans branch; empty means the profile's plans.ref, else plans.
  plans_dir:
    default: ""
    description: The directory on that branch holding plans/issue-<n>/ and workflows/; empty means the profile's plans.dir, else plans.
  pack:
    default: ""
    description: The installed pack's qualified name the generated workflow starts its phases from, for example tkcs-lab/devflow. Empty means the pack this workflow was started from.
returns: result
outcome_field: planned

nodes:
  - id: stage
    include: mod-devflow-plan-block
    with:
      work: "$INPUTS.work"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  # A block's skipped refusal nodes are among its sinks, so a node after it needs this trigger rule.
  - id: result
    depends_on: [stage]
    trigger_rule: none_failed_min_one_success
    bash: 'o=$stage.output; printf "%s\n" "$o"'
    output_format:
      type: object
      properties:
        planned: { type: boolean }
        issue: { type: integer }
        plan_revision: { type: integer }
        design_revision: { type: integer }
        workflow: { type: string }
        needs_refine: { type: boolean }
        unresolved_findings: { type: integer }
      required: [planned, issue, plan_revision, design_revision, workflow, needs_refine, unresolved_findings]
