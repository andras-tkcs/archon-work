name: devflow-refine
description: |
  Refines a GitHub issue into a published design.md: researches the issue and the code, asks at
  most two question rounds per pass (round 1 up to 5 questions, round 2 up to 3 and only when an
  answer opened a blocking question; each round is one pause), writes design.md from its template,
  checks it with validate-docs and publishes it to the plans branch (plans/issue-<n>/design.md),
  then updates the issue's one devflow comment. It ends with one pause: plan (run the plan block
  now and publish build-issue-<n>), revise (another pass, your note is the change request) or
  finish (the design stays published). Max 5 revisions per run.

  Refuses a closed issue and an issue whose build has started. Reply stop to a round to cancel
  without publishing.

  Use when: an issue should get a design before it is planned, "refine issue 42 with devflow".
  NOT for: planning a refined issue directly (devflow-plan), a quick edit (devflow-quick), or
  confidential security work (devflow-audit).
model: medium
worktree:
  enabled: true
inputs:
  work:
    default: ""
    description: The issue to refine (a number, #number or URL, a plan or design URL, or issue-<n>). Empty means the run's message.
  plans_ref:
    default: ""
    description: The plans branch; empty means the profile's plans.ref, else plans.
  plans_dir:
    default: ""
    description: The directory on that branch holding plans/issue-<n>/ and workflows/; empty means the profile's plans.dir, else plans.
  pack:
    default: ""
    description: The installed pack's qualified name, for example tkcs-lab/devflow. Empty means the pack this workflow was started from.
returns: result
outcome_field: designed

# Six passes, unrolled: a revise answer to pass k starts pass k+1; the last pass offers no revise.
# A block's skipped refusal nodes are among its sinks, so a node after a block needs
# none_failed_min_one_success.
nodes:
  - id: stage-1
    include: mod-devflow-refine-block
    with:
      work: "$INPUTS.work"
      change: ""
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: attend-1
    include: mod-devflow-attention
    depends_on: [stage-1]
    trigger_rule: none_failed_min_one_success
    with:
      stage: devflow-refine
      outcome: "$stage-1.output"
      last: "false"

  - id: go-2
    depends_on: [attend-1]
    when: "$attend-1.output.choice == 'revise'"
    bash: "true"

  - id: stage-2
    include: mod-devflow-refine-block
    depends_on: [go-2, attend-1]
    with:
      work: "$INPUTS.work"
      change: "$attend-1.output.brief"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: attend-2
    include: mod-devflow-attention
    depends_on: [stage-2]
    trigger_rule: none_failed_min_one_success
    with:
      stage: devflow-refine
      outcome: "$stage-2.output"
      last: "false"

  - id: go-3
    depends_on: [attend-2]
    when: "$attend-2.output.choice == 'revise'"
    bash: "true"

  - id: stage-3
    include: mod-devflow-refine-block
    depends_on: [go-3, attend-2]
    with:
      work: "$INPUTS.work"
      change: "$attend-2.output.brief"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: attend-3
    include: mod-devflow-attention
    depends_on: [stage-3]
    trigger_rule: none_failed_min_one_success
    with:
      stage: devflow-refine
      outcome: "$stage-3.output"
      last: "false"

  - id: go-4
    depends_on: [attend-3]
    when: "$attend-3.output.choice == 'revise'"
    bash: "true"

  - id: stage-4
    include: mod-devflow-refine-block
    depends_on: [go-4, attend-3]
    with:
      work: "$INPUTS.work"
      change: "$attend-3.output.brief"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: attend-4
    include: mod-devflow-attention
    depends_on: [stage-4]
    trigger_rule: none_failed_min_one_success
    with:
      stage: devflow-refine
      outcome: "$stage-4.output"
      last: "false"

  - id: go-5
    depends_on: [attend-4]
    when: "$attend-4.output.choice == 'revise'"
    bash: "true"

  - id: stage-5
    include: mod-devflow-refine-block
    depends_on: [go-5, attend-4]
    with:
      work: "$INPUTS.work"
      change: "$attend-4.output.brief"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: attend-5
    include: mod-devflow-attention
    depends_on: [stage-5]
    trigger_rule: none_failed_min_one_success
    with:
      stage: devflow-refine
      outcome: "$stage-5.output"
      last: "false"

  - id: go-6
    depends_on: [attend-5]
    when: "$attend-5.output.choice == 'revise'"
    bash: "true"

  - id: stage-6
    include: mod-devflow-refine-block
    depends_on: [go-6, attend-5]
    with:
      work: "$INPUTS.work"
      change: "$attend-5.output.brief"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: attend-6
    include: mod-devflow-attention
    depends_on: [stage-6]
    trigger_rule: none_failed_min_one_success
    with:
      stage: devflow-refine
      outcome: "$stage-6.output"
      last: "true"

  - id: choice
    depends_on: [attend-1, attend-2, attend-3, attend-4, attend-5, attend-6]
    trigger_rule: all_done
    script: refine-result
    runtime: bun
    with:
      mode: choice
      attend_1: { from: "$attend-1.output", if_skipped: "" }
      attend_2: { from: "$attend-2.output", if_skipped: "" }
      attend_3: { from: "$attend-3.output", if_skipped: "" }
      attend_4: { from: "$attend-4.output", if_skipped: "" }
      attend_5: { from: "$attend-5.output", if_skipped: "" }
      attend_6: { from: "$attend-6.output", if_skipped: "" }
    output_format:
      type: object
      properties:
        choice: { type: string }
        issue: { type: integer }
        outcome: { type: object }
      required: [choice, issue, outcome]

  - id: go-plan
    depends_on: [choice]
    when: "$choice.output.choice == 'plan'"
    bash: "true"

  - id: plan
    include: mod-devflow-plan-block
    depends_on: [go-plan, choice]
    with:
      work: "#$choice.output.issue"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      pack: "$INPUTS.pack"

  - id: result
    depends_on: [choice, plan]
    trigger_rule: all_done
    script: refine-result
    runtime: bun
    with:
      mode: result
      choice: "$choice.output"
      plan: { from: "$plan.output", if_skipped: "" }
    output_format:
      type: object
      properties:
        designed: { type: boolean }
        issue: { type: integer }
        revision: { type: integer }
        design_url: { type: string }
        planned: { type: boolean }
        needs_refine: { type: boolean }
      required: [designed, issue, revision, design_url, planned, needs_refine]
