name: devflow-refine
description: |
  Refines a plan that devflow-plan already published, before its implementation starts. It loads
  the plan from the plans branch, interviews you about what your request leaves open in up to 3
  rounds of up to 5 questions (a clear request needs no questions; a plan published as incomplete
  is continued from its slug alone), revises the plan with the same method, and republishes the
  plan and its devflow-run-<slug> workflow in place.

  Use when: "refine plans/<slug>: <what to change>", or a plan URL or slug and the change.
  NOT for: a plan whose implementation has started (its branch is on origin) or is merged, a new
  plan (devflow-plan), or a quick edit (devflow-quick).
model: medium
worktree:
  enabled: true
inputs:
  plan:
    default: ""
    description: The plan's slug, or its plan.md URL on the plans branch. Empty means the plan is named in the run's message.
  work:
    default: ""
    description: What to change in the plan. Empty means the run's message.
  plans_ref:
    default: plans
    description: The branch the plan and the generated workflow are pushed to.
  plans_dir:
    default: plans
    description: The directory on that branch that holds plans/<slug>/ and workflows/.
  pack:
    default: ""
    description: The installed pack's qualified name the generated workflow starts its phases from, for example tkcs-lab/devflow. Empty means the pack this workflow was started from.
returns: publish

nodes:
  # ---- Setup: profile, toolkit, environment ----------------------------------------------
  - id: preflight
    script: preflight
    runtime: bun
    output_format:
      type: object
      properties:
        devflow_root: { type: string }
        main_branch: { type: string }
        branch_regex: { type: string }
      required: [devflow_root, main_branch, branch_regex]

  - id: setup
    depends_on: [preflight]
    script: setup-env
    runtime: bun
    timeout: 1800000

  - id: load
    depends_on: [setup]
    script: load-published
    runtime: bun
    with:
      plan: "$INPUTS.plan"
      work: "$INPUTS.work"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      main_branch: "$preflight.output.main_branch"
    output_format:
      type: object
      properties:
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
        plan_commit: { type: string }
        started: { type: boolean }
        reason: { type: string }
        refusal: { type: string }
        work: { type: string }
      required: [slug, branch, title, plan_commit, started, reason, refusal, work]

  - id: refuse-started
    depends_on: [load]
    when: "$load.output.started == true"
    cancel: "$load.output.refusal"

  # ---- 1. The interview: up to 5 questions a round, at most 3 rounds ----------------------
  - id: interview
    depends_on: [load]
    when: "$load.output.started == false"
    loop_group:
      # next-question.ts ends the interview by the 4th iteration (3 asking rounds + 1 that records
      # the last answers); 5 leaves one spare.
      max_iterations: 5
      nodes:
        - id: draft
          command: draft
          model: medium
          context: fresh
          output_format:
            type: object
            properties:
              status: { type: string, enum: [ask, done, stop, publish] }
              questions: { type: array, items: { type: string } }
              why_no_more: { type: string }
            required: [status, questions, why_no_more]

        - id: challenge
          depends_on: [draft]
          when: "$draft.output.status == 'ask' || $draft.output.status == 'done'"
          command: challenge
          model: medium
          context: fresh
          output_format:
            type: object
            properties:
              questions:
                type: array
                items:
                  type: object
                  properties:
                    question: { type: string }
                    by: { type: string, enum: [planner, challenger] }
                  required: [question, by]
              reason: { type: string }
            required: [questions, reason]

        - id: next
          depends_on: [draft, challenge]
          trigger_rule: all_done
          script: next-question
          runtime: bun
          with:
            draft: "$draft.output"
            challenge: { from: "$challenge.output", if_skipped: "" }
          output_format:
            type: object
            properties:
              done: { type: boolean }
              stop: { type: boolean }
              incomplete: { type: boolean }
              question: { type: string }
            required: [done, stop, incomplete, question]

        - id: ask
          depends_on: [next]
          when: "$next.output.done == false"
          wait:
            attention: "$next.output.question"
            form: message
            labels:
              workflow: devflow-refine
              stage: interview
      until_bash: 'd=$next.output.done; [ "$d" = true ]'

  - id: stop-at-interview
    depends_on: [interview]
    when: "$interview.output.stop == true"
    cancel: "Stopped while refining: you said stop, so the interview ended without a refined plan. The published plan is unchanged. The questions and answers are interview.md in the run artifacts."

  # ---- 2. The final plan, the generated workflow, the publication ------------------------
  - id: plan-loop
    depends_on: [interview]
    when: "$interview.output.stop == false"
    loop_group:
      max_iterations: 3
      until_bash: 'd=$plan-check.output.done; [ "$d" = true ]'
      nodes:
        - id: finalize
          command: finalize
          model: medium
          context: fresh
          output_format:
            type: object
            properties:
              scope: { type: string, enum: [small, large] }
              slug: { type: string }
              branch: { type: string }
              title: { type: string }
              prerequisites: { type: boolean }
              after: { type: boolean }
            required: [scope, slug, branch, title, prerequisites, after]

        - id: render
          depends_on: [finalize]
          script: render-run
          runtime: bun
          with:
            slug: "$load.output.slug"
            branch: "$load.output.branch"
            title: "$finalize.output.title"
            main_branch: "$preflight.output.main_branch"
            branch_regex: "$preflight.output.branch_regex"
            plans_ref: "$INPUTS.plans_ref"
            plans_dir: "$INPUTS.plans_dir"
            pack: "$INPUTS.pack"
            soft_errors: "true"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              error: { type: string }
              workflow: { type: string }
              file: { type: string }
              waves: { type: integer }
            required: [ok, error, workflow, file, waves]

        - id: plan-test
          depends_on: [render]
          script: test-plan
          runtime: bun
          timeout: 600000
          with:
            render: "$render.output"
            devflow_root: "$preflight.output.devflow_root"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              findings: { type: array, items: { type: object } }
            required: [ok, findings]

        - id: plan-review
          depends_on: [plan-test]
          when: "$plan-test.output.ok == true"
          command: review-plan
          model: large
          context: fresh
          denied_tools: [Write, Edit, NotebookEdit]
          output_format:
            type: object
            properties:
              clean: { type: boolean }
              summary: { type: string }
              findings:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    source: { type: string, enum: [review] }
                    kind: { type: string, enum: [mechanical, open-decision] }
                    phase: { type: string }
                    problem: { type: string }
                    fix: { type: string }
                  required: [id, source, kind, phase, problem, fix]
            required: [clean, summary, findings]

        - id: plan-check
          depends_on: [plan-test, plan-review]
          trigger_rule: all_done
          script: check-plan
          runtime: bun
          with:
            test: "$plan-test.output"
            review: { from: "$plan-review.output", if_skipped: "" }
            round: "$LOOP_PREV.plan-check.output.round"
            finalize: "$finalize.output"
            render: "$render.output"
          output_format:
            type: object
            properties:
              done: { type: boolean }
              round: { type: integer }
              findings: { type: integer }
            required: [done, round, findings]

  - id: plan-result
    depends_on: [plan-loop]
    script: plan-result
    runtime: bun
    output_format:
      type: object
      properties:
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
        workflow: { type: string }
      required: [slug, branch, title, workflow]

  - id: still-unstarted
    depends_on: [plan-result]
    script: load-published
    runtime: bun
    with:
      plan: "$load.output.slug"
      work: "$load.output.work"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      main_branch: "$preflight.output.main_branch"
      check_only: "true"
    output_format:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]

  - id: publish
    depends_on: [still-unstarted]
    script: publish-plan
    runtime: bun
    with:
      slug: "$load.output.slug"
      title: "$plan-result.output.title"
      commit_verb: Refine
      workflow: "$plan-result.output.workflow"
      plans_ref: "$INPUTS.plans_ref"
      plans_dir: "$INPUTS.plans_dir"
      main_branch: "$preflight.output.main_branch"
    output_format:
      type: object
      properties:
        commit: { type: string }
        workflow: { type: string }
        message: { type: string }
      required: [commit, workflow, message]
