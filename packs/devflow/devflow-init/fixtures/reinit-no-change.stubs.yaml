# An initialised repository with nothing new: no question, the profile is left as it is, nothing to
# scaffold, so no branch and no PR.
fixture:
  expect: completed
  reached: [write, publish, result]
preflight: { shared_dir: /stub/devflow, main_branch: main, branch_regex: "^(feat|fix|chore)/[a-z0-9]+(-[a-z0-9]+)*$", has_profile: true, has_legacy: false }
scan: { scan_file: /stub/scan.json, source: profile, stacks: [python], leftovers: [] }
propose: { profile: { version: 1, project: { name: demo }, docs: { must_read: [README.md] }, git: { main_branch: main, branch_pattern: "<type>/<kebab-case>", branch_types: [feat, fix, chore] }, verify: { fast: ["ruff check ."], dod: [pytest] }, stacks: [python] }, provenance: { version: existing, project: existing, docs: existing, git: existing, verify: existing, stacks: existing }, questions: [], question_count: 0, summary: nothing new }
final: { profile: { version: 1, project: { name: demo }, docs: { must_read: [README.md] }, git: { main_branch: main, branch_pattern: "<type>/<kebab-case>", branch_types: [feat, fix, chore] }, verify: { fast: ["ruff check ."], dod: [pytest] }, stacks: [python] }, provenance: { version: existing } }
write: { path: .devflow/devflow.yaml, changed: false }
scaffold: { changed: [] }
doctor: { ok: 9, warn: 1, fail: 0, table: "| check | status | detail | fix |", checks: [] }
publish: &out { initialised: true, changed: false, files: [], pr_url: "", plans_branch_created: false, doctor: { ok: 9, warn: 1, fail: 0 } }
result: *out
