name: devflow-config
description: |
  Review a repository's GitHub configuration and bring the files in line: rulesets and branch
  protection, Actions settings and workflow files, access (collaborators, teams, deploy keys,
  webhooks), security features (Dependabot, code and secret scanning, private vulnerability
  reporting), merge settings, community files and the project's `.archon/config.yaml`. Built so
  the same run works on any repository; point `reference` at one whose setup you want to copy.

  1. snapshot: read-only, with the agent's own token; every endpoint records whether it was readable.
  2. An Opus reviewer compares the snapshot with the repo's own documented intent (its docs and
     ADRs), the workflow files, and the reference repository if given, and proposes changes with
     the evidence for each. Drift from the reference is a candidate, not a verdict. The review
     changes nothing in GitHub.
  3. Settings gaps are never applied here: they are listed in `config-review.md` for the admin
     user's `gh-baseline` (or as manual steps in the GitHub UI).
  4. Changes to files (workflow files, dependabot.yml, CODEOWNERS, SECURITY.md, templates,
     `.archon/config.yaml`) go through a pull request with the shared review, definition of done
     and watch. Never merges.

  Use when: setting up or auditing a repo's rulesets, access, Actions and security settings.
  NOT for: code security (devflow-audit), dependency updates (devflow-deps).
model: large
worktree:
  enabled: true
inputs:
  reference:
    default: ""
    description: Optional owner/name of a repository whose configuration is the model to compare against. Empty reviews the repository on its own.
returns: review-config
outcome_field: clean

nodes:
  - id: snapshot
    script: snapshot
    runtime: bun
    with:
      reference: "$INPUTS.reference"
    output_format:
      type: object
      properties:
        repo: { type: string }
        default_branch: { type: string }
        visibility: { type: string }
        can_admin: { type: boolean }
        role: { type: string }
        reference: { type: string }
        reference_ok: { type: boolean }
        unreadable: { type: array, items: { type: string } }
      required: [repo, default_branch, visibility, can_admin, role, reference, reference_ok, unreadable]

  - id: review-config
    depends_on: [snapshot]
    command: review-config
    model: large
    output_format:
      type: object
      properties:
        clean: { type: boolean }
        summary: { type: string }
        file_count: { type: integer }
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
        proposals:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              area: { type: string, enum: [ruleset, branch-protection, actions, access, security-features, repo-settings, community-files, workflow-file, other] }
              title: { type: string }
              why: { type: string }
              evidence: { type: string }
              risk: { type: string, enum: [low, medium, high] }
              reversible: { type: boolean }
              kind: { type: string, enum: [file] }
            required: [id, area, title, why, evidence, risk, reversible, kind]
        admin_settings:
          type: array
          items:
            type: object
            properties:
              check_id: { type: string }
              title: { type: string }
              command: { type: string }
            required: [check_id, title, command]
      required: [clean, summary, file_count, slug, branch, title, proposals, admin_settings]

  # ---- file changes: a branch, the edits, and the shared tail ----------------------------------
  # Runs when the review proposed file changes.
  - id: preflight
    depends_on: [review-config]
    when: "$review-config.output.file_count > 0"
    script: preflight
    runtime: bun
    output_format:
      type: object
      properties:
        shared_dir: { type: string }
        main_branch: { type: string }
        branch_regex: { type: string }
      required: [shared_dir, main_branch, branch_regex]

  - id: setup
    depends_on: [preflight]
    script: setup-env
    runtime: bun
    timeout: 1800000

  - id: prepare-branch
    depends_on: [setup]
    script: prepare-branch
    runtime: bun
    with:
      plan: "$review-config.output"
      branch_regex: "$preflight.output.branch_regex"
      main_branch: "$preflight.output.main_branch"
      shared_dir: "$preflight.output.shared_dir"
    output_format:
      type: object
      properties:
        proceed: { type: boolean }
        reason: { type: string }
        scope: { type: string }
        slug: { type: string }
        branch: { type: string }
        title: { type: string }
      required: [proceed, reason, scope, slug, branch, title]

  - id: stop-at-branch
    depends_on: [prepare-branch]
    when: "$prepare-branch.output.proceed == false"
    cancel: "Stopped before any edit: $prepare-branch.output.reason"

  - id: build
    depends_on: [prepare-branch]
    when: "$prepare-branch.output.proceed == true"
    loop_group:
      nodes:
        - id: implement
          command: edit-config
          model: medium
          context: fresh
          output_format:
            type: object
            properties:
              status: { type: string, enum: [continue, complete, blocked] }
              phase: { type: string }
              summary: { type: string }
            required: [status, phase, summary]
        - id: check
          depends_on: [implement]
          script: verify
          runtime: bun
          timeout: 1800000
          with:
            mode: fast
          output_format:
            type: object
            properties:
              green: { type: boolean }
              failed: { type: array, items: { type: string } }
              unavailable: { type: array, items: { type: string } }
              report: { type: string }
            required: [green, failed, unavailable, report]
      until_bash: 's=$implement.output.status; g=$check.output.green; [ "$s" = blocked ] || { [ "$s" = complete ] && [ "$g" = true ]; }'
      max_iterations: 6

  - id: gate-build
    depends_on: [build]
    script: gate-build
    runtime: bun
    with:
      branch: "$prepare-branch.output.branch"
      main_branch: "$preflight.output.main_branch"
      slug: "$prepare-branch.output.slug"
      green: "$build.output.green"
      phases: none

  - id: tail
    include: mod-devflow-tail
    depends_on: [gate-build]
