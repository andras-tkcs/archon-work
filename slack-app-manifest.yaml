# Slack app for Archon (Socket Mode — no public URL needed).
# api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
# Then: Basic Information -> App-Level Tokens -> generate one with scope
# connections:write (xapp-...), and Install to Workspace (xoxb-...).
display_information:
  name: Archon
  description: Claude Code workflows on my runner VM
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: archon
    always_online: true
  slash_commands:
    - command: /archon
      description: Start a new Archon thread
      usage_hint: "<what you want done>"
      should_escape: false
    - command: /archon-workflow
      description: List, run, approve or reject workflows
      usage_hint: "list | status | run | approve | reject | respond | abandon | resume"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - channels:join
      - im:history
      - im:write
      - im:read
      - mpim:write
      - reactions:write
      - commands
      - users:read
      - groups:history
      - mpim:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
