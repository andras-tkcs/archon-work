# A complete devflow profile using every key, with neutral names (no file checks: the files are not here).
version: 1

project:
  name: Example App

docs:
  must_read:
    - AGENTS.md
    - CONTRIBUTING.md
    - docs/releasing.md
    - docs/coding-guidelines.md
    - docs/testing-policy.md
    - docs/adr/README.md
  adr_dir: docs/adr
  adr_index: docs/adr/README.md
  adr_bar: CONTRIBUTING.md#decisions-and-adrs
  changelog:
    file: CHANGELOG.md
    section: "## [Unreleased]"

git:
  main_branch: main
  branch_pattern: "<type>/<kebab-case>"
  branch_types: [feature, fix, chore, tests]
  merge_style: merge-commit

plans:
  ref: plans
  dir: plans

verify:
  fast:
    - ruff check .
    - python3 -m pytest tests/unit -q
  dod:
    - run: pytest -v --cov=src/app --cov-branch --cov-report=term-missing --cov-report=json:coverage.json
      narrow: pytest -v {args}
    - run: python3 scripts/check_coverage_floor.py coverage.json
      skip_when_narrowed: true
    - ruff check .
    - python3 -m mypy src/app
    - run: npm test
      cwd: web
    - run: npm run typecheck
      cwd: web
  dod_conditional:
    - when: ["src/app/clients/**"]
      do: >-
        A live check of the changed client against the test account is owed: dispatch
        live-check.yml (see ci.dispatchable) instead of marking the row done.
    - when: ["pyproject.toml"]
      do: >-
        If a dependency changed: regenerate the lock files and commit them.
  dod_manual:
    - >-
      Is there a user-visible change? It needs a line under CHANGELOG.md's `## [Unreleased]`, never under a
      concrete version heading.
    - A decision that is hard to reverse needs an ADR in docs/adr/.
    - No log line carries a credential or a message body.
  dod_doc: docs/coding-guidelines.md#definition-of-done
  ci_local:
    enabled: true
    jobs: auto
    skip_jobs: [release]
    timeout_minutes: 20
    env: {CI: "true"}

ci:
  dispatchable:
    - workflow: record-fixture.yml
      use_when: A fixture for a newly added client
      notes: Commits the recorded fixture back to the dispatched branch; pull before continuing.
    - workflow: live-check.yml
      use_when: The live check for the definition-of-done row
      notes: No inputs.
    - workflow: windows-session.yml
      use_when: Windows autostart behaviour
      notes: No inputs.
    - workflow: linux-session.yml
      use_when: Linux autostart behaviour
      notes: No inputs.
    - workflow: macos-session.yml
      use_when: macOS autostart, .pkg install
      notes: No inputs.
    - workflow: build.yml
      use_when: A real installer for any platform
      notes: No inputs.
    - workflow: release.yml
      use_when: Cutting a release tag (never from a session without the maintainer's say-so)
      notes: Inputs `version` and `dry_run` (default true).

stacks: [python]

project_steward: docs/steward.md
